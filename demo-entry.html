<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Opening WashTrac Live Demo</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 24px;
      background: #020617;
      color: #fff;
      font-family: Arial, Helvetica, sans-serif;
    }
    .card {
      width: min(520px, 100%);
      padding: 32px;
      border: 1px solid #1e3a8a;
      border-radius: 16px;
      background: #0f172a;
      text-align: center;
      box-shadow: 0 20px 60px rgba(0,0,0,.45);
    }
    img {
      width: min(320px, 90%);
      height: auto;
      margin-bottom: 18px;
    }
    h1 {
      margin: 0 0 12px;
      font-size: 28px;
    }
    p {
      margin: 0;
      color: #94a3b8;
      line-height: 1.6;
    }
    .spinner {
      width: 42px;
      height: 42px;
      margin: 24px auto 0;
      border: 4px solid #1e293b;
      border-top-color: #2563eb;
      border-radius: 50%;
      animation: spin .8s linear infinite;
    }
    .error {
      display: none;
      margin-top: 18px;
      padding: 12px;
      border: 1px solid #7f1d1d;
      border-radius: 10px;
      background: rgba(127,29,29,.25);
      color: #fecaca;
    }
    .retry {
      display: none;
      margin-top: 16px;
      padding: 11px 16px;
      border: 0;
      border-radius: 8px;
      background: #2563eb;
      color: #fff;
      font-weight: 700;
      cursor: pointer;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
  </style>
</head>
<body>
  <main class="card">
    <img src="washtrac-logo.png" alt="WashTrac" />
    <h1>Opening Live Demo</h1>
    <p>Preparing the protected WashTrac demonstration facility.</p>
    <div id="spinner" class="spinner" aria-label="Loading"></div>
    <div id="errorBox" class="error"></div>
    <button id="retryButton" class="retry" type="button">Try Again</button>
  </main>

  <script>
    const SUPABASE_URL = "https://feqrsypiugwwdweiwvua.supabase.co";
    const SUPABASE_KEY = "sb_publishable_wWkZTvf6dLAlreLlLAOcXA_7jG3D8GS";
    const DEMO_SITE_ID = "09ec332c-f734-4f9b-80dd-9fd99668a50e";
    const DEMO_ORG_ID = "fa0dd58e-c164-48b8-8e82-f9abd2d0c6b2";

    const client = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

    async function openDemo() {
      const spinner = document.getElementById("spinner");
      const errorBox = document.getElementById("errorBox");
      const retryButton = document.getElementById("retryButton");

      spinner.style.display = "block";
      errorBox.style.display = "none";
      retryButton.style.display = "none";

      try {
        await client.auth.signOut();

        const response = await fetch("/api/demo-login", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          cache: "no-store"
        });

        const payload = await response.json().catch(() => ({}));

        if (!response.ok) {
          throw new Error(payload.error || "The live demo could not be opened.");
        }

        const { error } = await client.auth.setSession({
          access_token: payload.access_token,
          refresh_token: payload.refresh_token
        });

        if (error) throw error;

        localStorage.setItem("washtracLoggedIn", "yes");
        localStorage.setItem("selectedSiteId", DEMO_SITE_ID);
        localStorage.setItem("selectedOrgId", DEMO_ORG_ID);
        localStorage.setItem("activeSiteId", DEMO_SITE_ID);
        localStorage.setItem("washtracActiveSiteId", DEMO_SITE_ID);
        localStorage.setItem("activeOrganizationId", DEMO_ORG_ID);
        localStorage.setItem("canViewAllSites", "false");
        localStorage.setItem("availableSites", JSON.stringify([
          {
            site_id: DEMO_SITE_ID,
            organization_id: DEMO_ORG_ID,
            role: "admin",
            can_view_all_sites: false,
            sites: {
              id: DEMO_SITE_ID,
              name: "WashTrac Demo Facility",
              organization_id: DEMO_ORG_ID
            }
          }
        ]));

        window.location.replace("dashboard.html");
      } catch (error) {
        console.error("Demo entry error:", error);
        spinner.style.display = "none";
        errorBox.textContent = error.message || "The live demo could not be opened.";
        errorBox.style.display = "block";
        retryButton.style.display = "inline-block";
      }
    }

    document.getElementById("retryButton").addEventListener("click", openDemo);
    openDemo();
  </script>
</body>
</html>
